{% extends 'base.html' %}

{% block title %}Admin Portal Login - SYDNEY CLINIC HAMS{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card glass-card border-0 shadow-lg p-4 mt-4">
            <div class="card-body">
                <div class="text-center mb-4">
                    <span class="p-3 bg-light rounded-circle d-inline-block mb-3 text-warning">
                        <i class="fa-solid fa-user-shield fa-2x"></i>
                    </span>
                    <h2 class="fw-bold">Admin Portal</h2>
                    <p class="text-muted">Sign in to the administrative command center</p>
                </div>

                <form method="POST">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label for="username" class="form-label fw-semibold">Admin Username</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="fa-solid fa-user text-muted"></i></span>
                            <input type="text" name="username" id="username" class="form-control" placeholder="Enter admin username" required>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label fw-semibold">Admin Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="fa-solid fa-lock text-muted"></i></span>
                            <input type="password" name="password" id="password" class="form-control" placeholder="Enter admin password" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <button type="submit" class="btn btn-secondary-custom btn-lg w-100 shadow-sm" style="background-color: var(--secondary-color);">
                            <i class="fa-solid fa-shield-halved me-2"></i>Authenticate Admin
                        </button>
                    </div>
                </form>

                <div class="text-center mt-4">
                    <a href="{% url 'patient_login' %}" class="small text-teal fw-semibold text-decoration-none" style="color: var(--primary-color);">
                        <i class="fa-solid fa-arrow-left me-1"></i>Switch to Patient Portal
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
