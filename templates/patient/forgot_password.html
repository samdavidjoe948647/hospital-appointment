{% extends 'base.html' %}
{% block title %}Forgot Password - SYDNEY CLINIC{% endblock %}

{% block content %}
<div class="row justify-content-center fade-in-up">
    <div class="col-md-6 col-lg-5">
        <div class="glass-card p-5 mt-4 text-center">
            <div class="mb-4">
                <div class="stat-icon mb-3 text-warning">
                    <i class="fa-solid fa-unlock-keyhole"></i>
                </div>
                <h3 class="fw-bold" style="font-family: 'Outfit', sans-serif;">Forgot Password</h3>
                <p class="text-muted small">Enter your credentials to recover your account.</p>
            </div>
            <form method="POST">
                {% csrf_token %}
                <div class="mb-3 text-start">
                    <label class="form-label fw-bold text-secondary">Username</label>
                    <input type="text" name="username" class="form-control" required placeholder="e.g. johndoe">
                </div>
                <div class="mb-4 text-start">
                    <label class="form-label fw-bold text-secondary">Email Address</label>
                    <input type="email" name="email" class="form-control" required placeholder="john@example.com">
                </div>
                <div class="d-grid mt-4">
                    <button type="submit" class="btn btn-primary btn-lg shadow-sm">
                        <i class="fa-solid fa-envelope me-2"></i>Reset Password
                    </button>
                </div>
            </form>
            <div class="mt-4 pt-3 border-top">
                <a href="{% url 'patient_login' %}" class="text-decoration-none fw-bold" style="color: var(--primary-color);">
                    <i class="fa-solid fa-arrow-left me-1"></i>Back to Login
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
