{% extends 'base.html' %}

{% block title %}Patient Login - SYDNEY CLINIC HAMS{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card glass-card border-0 shadow-lg p-4 mt-4">
            <div class="card-body">
                <div class="text-center mb-4">
                    <span class="p-3 bg-light rounded-circle d-inline-block mb-3 text-teal" style="color: var(--primary-color);">
                        <i class="fa-solid fa-lock fa-2x"></i>
                    </span>
                    <h2 class="fw-bold">Patient Portal</h2>
                    <p class="text-muted">Sign in to manage your appointments</p>
                </div>

                <form method="POST">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label for="username" class="form-label fw-semibold">Username</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="fa-solid fa-user text-muted"></i></span>
                            <input type="text" name="username" id="username" class="form-control" placeholder="Enter username" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <div class="d-flex justify-content-between align-items-center mb-1">
                            <label for="password" class="form-label fw-semibold mb-0">Password</label>
                            <a href="{% url 'patient_forgot_password' %}" class="small text-decoration-none text-teal fw-semibold" style="color: var(--primary-color);">Forgot Password?</a>
                        </div>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="fa-solid fa-lock text-muted"></i></span>
                            <input type="password" name="password" id="password" class="form-control" placeholder="Enter password" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <button type="submit" class="btn btn-primary btn-lg w-100 shadow-sm">
                            <i class="fa-solid fa-right-to-bracket me-2"></i>Sign In
                        </button>
                    </div>
                </form>

                <div class="text-center mt-4">
                    <p class="mb-0 text-muted">Don't have a patient account? <a href="{% url 'patient_register' %}" class="fw-semibold text-teal" style="color: var(--primary-color);">Register Here</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
