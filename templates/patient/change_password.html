{% extends 'base.html' %}
{% block title %}Change Password - SYDNEY CLINIC{% endblock %}

{% block content %}
<div class="row justify-content-center fade-in-up">
    <div class="col-md-6 col-lg-5">
        <div class="glass-card p-5 mt-4 text-center">
            <div class="mb-4">
                <div class="stat-icon mb-3">
                    <i class="fa-solid fa-key text-primary"></i>
                </div>
                <h3 class="fw-bold" style="font-family: 'Outfit', sans-serif;">Change Password</h3>
                <p class="text-muted small">Ensure your account is using a strong, unique password.</p>
            </div>
            <form method="POST">
                {% csrf_token %}
                <div class="mb-3 text-start">
                    <label class="form-label fw-bold text-secondary">Current Password</label>
                    <input type="password" name="old_password" class="form-control" required placeholder="••••••••">
                </div>
                <div class="mb-3 text-start">
                    <label class="form-label fw-bold text-secondary">New Password</label>
                    <input type="password" name="new_password" class="form-control" required minlength="6" placeholder="••••••••">
                </div>
                <div class="mb-4 text-start">
                    <label class="form-label fw-bold text-secondary">Confirm New Password</label>
                    <input type="password" name="confirm_password" class="form-control" required minlength="6" placeholder="••••••••">
                </div>
                <div class="d-grid mt-4">
                    <button type="submit" class="btn btn-primary btn-lg shadow-sm">
                        <i class="fa-solid fa-shield-halved me-2"></i>Update Password
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
